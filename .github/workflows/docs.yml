name: Documentación

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "Makefile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/actions/cruz-installation-token/**"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "Makefile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/actions/cruz-installation-token/**"
      - ".github/workflows/docs.yml"
  release:
    types: [published]

jobs:
  build-docs:
    name: Validar documentación
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Solicitar token de lectura a Cruz
        id: cruz-token
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/cruz-installation-token
        with:
          repositories: '["radiocutfm/fierro"]'
          permissions: '{"contents":"read"}'
      - name: Descargar el inventario de Fierro
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v6
        with:
          repository: radiocutfm/fierro
          ref: develop
          path: fierro-docs
          token: ${{ steps.cruz-token.outputs.token || github.token }}
          sparse-checkout: docs/_intersphinx/fierro.inv
          sparse-checkout-cone-mode: false
      - uses: astral-sh/setup-uv@v8.2.0
      - name: Compilar documentación del PR
        if: github.event_name == 'pull_request'
        env:
          INTERSPHINX_FIERRO_INVENTORY: ${{ github.workspace }}/docs/_intersphinx/fierro.inv
        run: make docs
      - name: Compilar documentación integrada
        if: github.event_name != 'pull_request'
        env:
          INTERSPHINX_FIERRO_INVENTORY: ${{ github.workspace }}/fierro-docs/docs/_intersphinx/fierro.inv
        run: make docs

  dispatch-fierro:
    name: Notificar a Fierro
    needs: build-docs
    if: github.event_name == 'push' || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Solicitar token de escritura a Cruz
        id: cruz-token
        uses: ./.github/actions/cruz-installation-token
        with:
          repositories: '["radiocutfm/fierro"]'
          permissions: '{"contents":"write"}'
      - name: Disparar la reconstrucción integrada
        env:
          GH_TOKEN: ${{ steps.cruz-token.outputs.token }}
        run: |
          gh api repos/radiocutfm/fierro/dispatches --method POST --input - <<JSON
          {
            "event_type": "external-docs-updated",
            "client_payload": {
              "source": "harness",
              "ref": "${GITHUB_REF_NAME}",
              "sha": "${GITHUB_SHA}"
            }
          }
          JSON
