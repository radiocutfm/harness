name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Preparar artefactos
        run: |
          mkdir release
          cp install.sh install.ps1 release/
          sed 's/@HARNESS_VERSION@/${{ github.event.release.tag_name }}/g' install.py > release/install.py
          tar -czf release/skills.tar.gz skills
          sha256sum release/* > release/checksums.txt
      - name: Adjuntar artefactos al release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" release/* --clobber
