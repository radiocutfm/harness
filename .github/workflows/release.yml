name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: astral-sh/setup-uv@v6
      - name: Preparar artefactos
        run: |
          mkdir release
          cp bootstrap/install.sh bootstrap/install.ps1 release/
          uv build --wheel --out-dir release
          cp release/fierro_harness-*.whl release/fierro_harness-latest.whl
          sha256sum release/* > release/checksums.txt
      - name: Adjuntar artefactos al release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" release/* --clobber
