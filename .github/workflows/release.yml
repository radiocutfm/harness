name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tag de release, por ejemplo 0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar artefactos
        run: |
          mkdir release
          cp install.sh install.ps1 install.py release/
          sha256sum release/* > release/checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Harness v${{ inputs.version }}
          generate_release_notes: true
          files: |
            release/*
